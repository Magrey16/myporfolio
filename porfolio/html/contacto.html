    <main class="contact">
        <div class="card">
            <div class="contact-card__div">
                <h1 class="contact-card__title">CONTÁCTAME</h1>
            </div>

            <form class="contact-form">
                <div class="contact-form__group">
                    <label for="email" class="contact-form__label">&lt;CORREO ELECTRÓNICO&gt;</label>
                    <input type="email" id="email" name="email" class="contact-form__input" />
                </div>

                <div class="contact-form__group">
                    <label for="subject" class="contact-form__label">&lt;ASUNTO&gt;</label>
                    <input type="text" id="subject" name="subject" class="contact-form__input" />
                </div>

                <div class="contact-form__group">
                    <label for="message" class="contact-form__label">&lt;MENSAJE&gt;</label>
                    <textarea id="message" name="message" class="contact-form__textarea"></textarea>
                </div>

                <div class="contact-form__actions">
                    <button class="contact-form__button">Enviar</button>
                </div>
            </form>
        </div>

        <aside class="contact-map">
            <div class="contact-map__wrapper">
                <iframe class="contact-map__iframe"
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3169.8925970935047!2d-5.991180088453406!3d37.39237217196825!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd126c035971c2ab%3A0xeda713319b218290!2sC.%20Ni%C3%B1o%20Ricardo%2C%20Casco%20Antiguo%2C%2041003%20Sevilla!5e0!3m2!1ses-419!2ses!4v1794151952965!5m2!1ses-419!2ses"
                    title="Mapa de ubicación en Sevilla" loading="lazy" rel="preload" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </aside>
    </main>

    <footer class="footer__papa">
